# Syntax: https://github.com/lowlighter/metrics/blob/3e76a72fcaa02599bc8874a93e367ee7a71d9afb/source/plugins/core/metadata.yml
# Interactive Editor: https://metrics.lecoq.io
name: Metrics
on:

  # Allow manual run
  workflow_dispatch:
  schedule:
    - cron: "0 8 1 * *"

  # Run action when pushing on these branches
  push:
    branches:
      - master
      - main

jobs:
  info:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🗃️ Info
        uses: redsigma/metrics@stable
        with:
          use_prebuilt_image: yes
          filename: metrics.base.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_gist: ${{ secrets.GIST_METRICS }}
          base: header
          output_action: gist
          plugins_errors_fatal: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

  languages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 💻 Most used languages
        uses: redsigma/metrics@stable
        with:
          use_prebuilt_image: yes
          filename: metrics.plugin.mostlanguages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_gist: ${{ secrets.GIST_METRICS }}
          base: ""
          output_action: gist
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup,programming,data
          plugin_languages_sections: most-used
          plugin_languages_threshold: 3%
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_colors: github, lua:blue, python:yellow
          plugin_languages_ignored: >-
            html, css, tex, less, dockerfile, makefile, qmake,
            lex, cmake, gnuplot, Pip Requirements, Rich Text Format, ReScript
          plugin_languages_skipped: redsigma/redsigma, redsigma/metrics

  contributions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📀 Contributions
        uses: redsigma/metrics@stable
        with:
          use_prebuilt_image: yes
          filename: metrics.plugin.contributions.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_gist: ${{ secrets.GIST_METRICS }}
          base: ""
          output_action: gist
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: commit, pull-request, issue
          plugin_notable_self: no
          plugin_notable_filter: commits:>50
          plugin_notable_repositories: yes
          plugin_notable_skipped: redsigma/redsigma, redsigma/metrics, EventAccess/*

  activity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📰 Recent activity
        uses: redsigma/metrics@stable
        with:
          use_prebuilt_image: yes
          filename: metrics.plugin.activity.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_gist: ${{ secrets.GIST_METRICS }}
          base: ""
          output_action: gist
          plugins_errors_fatal: yes
          plugin_activity: yes
          plugin_activity_show_empty: no
          plugin_activity_commit_messages: yes
          plugin_activity_limit: 10
          plugin_activity_unique: true
          plugin_activity_load: 1000
          plugin_activity_days: 0
          plugin_activity_filter: push, issue, pr, release, review, ref/create, comment
          plugin_activity_skipped: redsigma/redsigma, redsigma/metrics

  reactions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🎭 Comment Reactions
        uses: redsigma/metrics@stable
        with:
          use_prebuilt_image: no
          filename: metrics.plugin.reactions.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_gist: ${{ secrets.GIST_METRICS }}
          base: ""
          output_action: gist
          plugins_errors_fatal: yes
          plugin_reactions: yes
          plugin_reactions_limit: 100
          plugin_reactions_details: count
          plugin_reactions_filter: reactions.count:>0

  followers:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🧑‍🤝‍🧑 Followers
        uses: redsigma/metrics@stable
        with:
          use_prebuilt_image: yes
          filename: metrics.plugin.followers.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_gist: ${{ secrets.GIST_METRICS }}
          base: ""
          output_action: gist
          plugins_errors_fatal: yes
          plugin_people: yes
          plugin_people_types: followers
          plugin_people_size: 32

  merge:
    needs: [info, languages, contributions, activity, reactions, followers]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Processing metrics output
        env:
          GIST_ID:  ${{ secrets.GIST_METRICS }}
          TOKEN:    ${{ secrets.METRICS_TOKEN }}
          GROUPS: |
            [
              {
                "outfile": "metrics.left.svg",
                "files": [
                  "metrics.plugin.activity.svg",
                  "metrics.plugin.reactions.svg",
                  "metrics.plugin.followers.svg"
                ]
              },
              {
                "outfile": "metrics.right.svg",
                "files": [
                  "metrics.plugin.mostlanguages.svg",
                  "metrics.plugin.contributions.svg"
                ]
              }
            ]
        run: |
          set -euo pipefail

          sudo apt-get update -y
          sudo apt-get install -y jq libxml2-utils bc

          cat > stack_one.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          GIST_ID="$1"; TOKEN="$2"; OUTFILE="$3"; LISTFILE="$4"

          curl -fsSL -H "Authorization: token $TOKEN" "https://api.github.com/gists/$GIST_ID" -o gist.json

          get_raw()  { jq -r --arg f "$1" '.files[$f].raw_url // empty' gist.json; }
          get_attr() { xmllint --xpath 'string(/*[local-name()="svg"]/@'"$1"')' "$2" 2>/dev/null || true; }

          WIDTHS=(); HEIGHTS=(); VBS=(); INNER_PATHS=()
          idx=0

          while IFS= read -r F; do
            [ -z "$F" ] && continue
            RAW=$(get_raw "$F")
            if [ -z "$RAW" ]; then
              printf 'Missing in gist: %s\n' "$F"
              exit 1
            fi

            SRC="src_$idx.svg"
            curl -fsSL "$RAW" -o "$SRC"

            VB=$(get_attr viewBox "$SRC")
            if [ -n "$VB" ]; then
              set -- $VB; W=$3; H=$4
            else
              WIDTH=$(get_attr width "$SRC");  HEIGHT=$(get_attr height "$SRC")
              W=${WIDTH%px};  W=${W%%%};  [ -z "$W" ] && W=1024
              H=${HEIGHT%px}; H=${H%%%}; [ -z "$H" ] && H=400
            fi

            WIDTHS+=("$W"); HEIGHTS+=("$H"); VBS+=("$VB")

            INNER="inner_$idx.svg"
            xmllint --xpath '/*[local-name()="svg"]/*' "$SRC" > "$INNER" 2>/dev/null || printf '' > "$INNER"
            INNER_PATHS+=("$INNER")

            idx=$((idx+1))
          done < "$LISTFILE"

          COUNT=${#WIDTHS[@]}
          if [ "$COUNT" -eq 0 ]; then
            printf 'No valid SVGs found for %s.\n' "$OUTFILE"
            exit 1
          fi

          CW=0; CH=0
          for i in $(seq 0 $((COUNT-1))); do
            W=${WIDTHS[$i]}; H=${HEIGHTS[$i]}
            GT=$(echo "$W > $CW" | bc -l)
            if [ "$GT" -eq 1 ]; then CW=$W; fi
            CH=$(echo "$CH + $H" | bc -l)
          done

          cat > merged.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 $CW $CH">
          EOF

          Y=0
          for i in $(seq 0 $((COUNT-1))); do
            W=${WIDTHS[$i]}
            H=${HEIGHTS[$i]}
            VB=${VBS[$i]}
            INNER=${INNER_PATHS[$i]}

            if [ -n "$VB" ]; then
              cat >> merged.svg <<EOF
            <svg x="0" y="$Y" viewBox="$VB" width="$W" height="$H">
          EOF
            else
              cat >> merged.svg <<EOF
            <svg x="0" y="$Y" width="$W" height="$H">
          EOF
            fi

            cat "$INNER" >> merged.svg

            cat >> merged.svg <<'EOF'
            </svg>
          EOF

            Y=$(echo "$Y + $H" | bc -l)
          done

          cat >> merged.svg <<'EOF'
          </svg>
          EOF

          mkdir -p merged
          mv merged.svg "merged/$OUTFILE"
          printf 'Prepared %s\n' "$OUTFILE"
          BASH
          chmod +x stack_one.sh
          # --- end reusable script ---

          printf '%s' "$GROUPS" > groups.json
          jq -c '.[]' groups.json | while IFS= read -r group; do
            OUTFILE=$(printf '%s' "$group" | jq -r '.outfile')
            printf '%s' "$group" | jq -r '.files[]' > files.txt

            printf '→ Building %s from:\n' "$OUTFILE"
            cat files.txt

            ./stack_one.sh "$GIST_ID" "$TOKEN" "$OUTFILE" files.txt
          done

          jq -n '{files:{}}' > gist-payload.json
          for FILE in metrics.left.svg metrics.right.svg; do
            jq --arg name "$FILE" --rawfile content "merged/$FILE" \
              '.files[$name] = {content: $content}' \
              gist-payload.json > gist-payload.tmp
            mv gist-payload.tmp gist-payload.json
          done

          # Remove temporary files created by the previous merge implementation.
          curl --fail-with-body -sSL -X PATCH \
              -H "Authorization: token $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d @gist-payload.json \
              "https://api.github.com/gists/$GIST_ID" >/dev/null
